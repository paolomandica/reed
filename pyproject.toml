[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "reed"
version = "0.1.0"
description = "Convert X.com articles to ebooks and audiobooks"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "click>=8.0",
    "httpx>=0.28",
    "ebooklib>=0.18",
    "flask>=3.0",
    "soundfile",
    "torch",
    "setuptools<70",
    "chatterbox-tts>=0.1.7",
    "numpy>=2.4.6",
]

[project.optional-dependencies]
browser = ["playwright>=1.50"]

[project.scripts]
reed = "reed.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/reed"]
