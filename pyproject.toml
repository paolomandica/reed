[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "reed"
version = "0.1.0"
description = "Convert X.com articles to ebooks and audiobooks"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "click>=8.0",
    "ebooklib>=0.18",
    "flask>=3.0",
    "kokoro>=0.9.2",
    "markdownify>=1.2.0",
    "numpy>=2.4.6",
    "soundfile",
]

[project.scripts]
reed = "reed.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/reed"]
