[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "reed"
version = "0.1.0"
description = "Convert saved article pages to ebooks and audiobooks"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "click>=8.0",
    "ebooklib>=0.18",
    "flask>=3.0",
    "kokoro>=0.9.2",
    "markdown-it-py>=4.0.0",
    "markdownify>=1.2.0",
    "numpy>=2.4.6",
    "soundfile",
    "torch==2.11.0",
]

[project.optional-dependencies]
dev = [
    "certifi>=2026.5.20",
    "certifi-linux>=1.1.0",
    "python-certifi-win32>=1.6.1",
]

[project.scripts]
reed = "reed.cli:main"

[tool.uv]
override-dependencies = ["torch==2.11.0"]

[tool.uv.sources]
torch = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.hatch.build.targets.wheel]
packages = ["src/reed"]
