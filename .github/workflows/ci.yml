name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.13"
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes ffmpeg espeak-ng
      - name: Install macOS system dependencies
        if: runner.os == 'macOS'
        run: brew install ffmpeg espeak-ng
      - name: Sync environment
        run: uv sync --locked --extra dev
      - name: Check setup scripts
        run: bash -n scripts/setup-macos.sh scripts/setup-linux.sh
      - name: Lint
        run: uv run ruff check .
      - name: Type check
        run: uv run mypy src
      - name: Tests
        run: uv run python -m unittest discover -s tests
      - name: Build
        run: uv build
      - name: Verify demo sample is bundled in the wheel
        run: unzip -l dist/*.whl | grep -q "reed/examples/reed-demo.md"
